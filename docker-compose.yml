services:
  postgres:
    image: postgres:16-alpine
    container_name: guestly-postgres
    environment:
      POSTGRES_USER: guestly
      POSTGRES_PASSWORD: guestly
      POSTGRES_DB: guestly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestly"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
